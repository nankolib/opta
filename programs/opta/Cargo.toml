[package]
name = "opta"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "opta"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Gates test-only profiling instructions (e.g. cu_profile_american). NEVER
# enable in default builds or deploy a cu-profile build to devnet/mainnet.
cu-profile = []

# Phase 2 Stage B Step 3: shrinks VOL_ORACLE_MIN_PUSH_INTERVAL_SECS from
# 55 minutes (production) to 1 second so multi-push ring-buffer tests can
# run against solana-test-validator (which advances Clock at wall-clock
# rate; no warp helper). NEVER enable in default builds or deploy a
# test-fast-vol build to devnet/mainnet -- production rate-limiting
# disappears entirely. The .test-fixtures/run-tests.sh launcher passes
# this feature to anchor build; production deploy scripts must not.
test-fast-vol = []
# Phase 2 Stage D: flips feature_flags::AMERICAN_ENABLED to true so the
# American vault arms (create_shared_vault, mint_from_vault) are reachable.
# Used ONLY to run the American test suite before Stage I. NEVER deploy a
# build with this feature enabled — at Stage I flip the not(feature) default
# in feature_flags.rs to true and deploy FEATURE-FREE instead.
american-enabled = []
# Phase 2 fixture-rot remediation: gates the test-only `synth_warm_vol_oracle`
# instruction, which plants warmed VolOracle state (sample_count=720, fresh
# ts, V2 accumulators, caller spot) so American pricing reads Ok without 168
# rate-limited pushes. NEVER enable in default builds or deploy a
# test-synth-vol build — it lets anyone overwrite an oracle's vol state,
# destroying pricing integrity. The .test-fixtures launcher passes this for
# the American suite; production deploy scripts must not.
test-synth-vol = []
# LOW-5 fail-closed marker for the deployable-artifact guard (see lib.rs). Any
# build carrying a test/dev feature (test-fast-vol / test-synth-vol / cu-profile)
# OR `american-enabled` MUST also pass `testing`, else compilation aborts via
# compile_error!. Test harnesses pass `--features testing …`; production deploys
# are FEATURE-FREE and never set this. Forgetting it on a test build fails loudly
# (fail-closed); the only way test code reaches a deploy is a deliberate
# `--features testing` on a production build.
testing = []


[dependencies]
# `allow-missing-optionals` (Stage 3): lets a TRAILING absent optional account
# deserialize to None instead of erroring AccountNotEnoughKeys. Required so a Pyth
# market omits the 3 trailing Switchboard read-arm accounts and keeps its tx
# byte-identical. Inert for every existing instruction (the only other Option
# account, epoch_config, is non-trailing so never hits the empty-accounts branch).
anchor-lang = { version = "0.32.1", features = ["init-if-needed", "allow-missing-optionals"] }
anchor-spl = { version = "0.32.1", features = ["associated_token", "metadata", "token_2022", "token_2022_extensions"] }
spl-token-2022 = { version = "8.0.1", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.10.0"
spl-tlv-account-resolution = "0.10.0"
spl-token-metadata-interface = "0.7.0"
opta-transfer-hook = { path = "../opta-transfer-hook", features = ["cpi"] }
solmath = { version = "0.1.2", default-features = false, features = ["bs"] }
pyth-solana-receiver-sdk = "1.1.0"
# Direct dep so cu-profile builds can name `solana_program::log::sol_log_compute_units`.
# Already pulled in transitively by anchor at 2.3.0; this just exposes the API.
solana-program = "2"
# Required by Anchor 0.32.1's `#[account(zero_copy)]` macro: emitted code
# uses bare `bytemuck::` paths so consumers must declare the crate
# directly even though anchor_lang re-exports it under __private.
# Consumed by state/vol_oracle.rs (Phase 2 Stage B). The
# `min_const_generics` feature is required so `[i64; 720]` (and any
# other ring-buffer-sized array) implements `Pod`; without it bytemuck
# only impls Pod for arrays of a small whitelisted size set.
bytemuck = { version = "1", features = ["min_const_generics"] }
# Switchboard On-Demand on-chain verify SDK (Stage 3 read seam). default-features
# = false drops the `client` tree (tokio/reqwest/prost); `anchor` = anchor-lang +
# solana-v2 for AccountInfo type alignment with Anchor 0.32.1. NEVER enable
# client/client-v3 — those pull std networking and do not belong on-chain.
switchboard-on-demand = { version = "=0.13.0", default-features = false, features = ["anchor"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
