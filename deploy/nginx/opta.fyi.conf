# Opta production web — static Vite/React SPA at opta.fyi + www.
# Served from the Vultr box <VPS_IP> (same box as the crank + sb-create).
# HTTP-only here; `certbot --nginx -d opta.fyi -d www.opta.fyi` adds the 443
# server block + the 80->443 redirect. Does NOT touch the sb-create block.
#
# add_header does not inherit into a location that sets its own add_header, so
# each location `include`s snippets/opta-headers.conf (security + CSP) and sets
# its own Cache-Control.
server {
    listen 80;
    listen [::]:80;
    server_name opta.fyi www.opta.fyi;

    root /opt/opta-web/dist;
    index index.html;

    # Build id — never cache (drives the version self-heal toast).
    location = /version.json {
        include snippets/opta-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed immutable assets — cache hard for a year.
    location /assets/ {
        include snippets/opta-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — unknown paths (deep links like /trade) serve index.html.
    location / {
        include snippets/opta-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
